name: Auto Renew and Deploy SSL Certificates

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 20 */2 *' # 每两个月的第二十天执行一次

jobs:
  renew-deploy-cert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install acme.sh
      env:
        EMAIL: ${{ secrets.EMAIL}}
      run: |
        sudo apt-get update
        sudo apt-get install -y socat
        curl https://get.acme.sh | sh -s email="${EMAIL}"

    - name: Prepare certificate directories
      env:
        CERT_DOMAINS: ${{ secrets.CERT_DOMAINS }}
      run: |
        mkdir -p ~/.acme.sh
        IFS=',' read -r -a cert_array <<< "${CERT_DOMAINS}"
        for cert_domain in "${cert_array[@]}"; do
          slug="${cert_domain//\*/_wildcard}"
          mkdir -p ~/certs/${slug}
        done

    - name: Obtain SSL Certificates
      env:
        CERT_DOMAINS: ${{ secrets.CERT_DOMAINS }}
        Ali_Key: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        Ali_Secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      run: |
        IFS=',' read -r -a cert_array <<< "${CERT_DOMAINS}"
        for cert_domain in "${cert_array[@]}"; do
          slug="${cert_domain//\*/_wildcard}"
          echo "Issuing certificate for: ${cert_domain} -> ~/certs/${slug}"
          ~/.acme.sh/acme.sh --issue --server letsencrypt --dns dns_ali -d "${cert_domain}" \
            --key-file ~/certs/${slug}/privkey.pem \
            --fullchain-file ~/certs/${slug}/fullchain.pem
        done

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Upload certificates to Alibaba Cloud CDN
      env:
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        CERT_DOMAINS: ${{ secrets.CERT_DOMAINS }}
        ALIYUN_CDN_DOMAINS: ${{ secrets.ALIYUN_CDN_DOMAINS }}
      run: python upload_certs_to_aliyun.py

    - name: Upload certificates to Alibaba Cloud ESA
      env:
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        CERT_DOMAINS: ${{ secrets.CERT_DOMAINS }}
        # 格式: siteId:host1+host2,siteId2:host3
        ALIYUN_ESA_BINDINGS: ${{ secrets.ALIYUN_ESA_BINDINGS }}
      run: python upload_certs_to_esa.py

    - name: Clean up
      env:
        CERT_DOMAINS: ${{ secrets.CERT_DOMAINS }}
      run: |
        IFS=',' read -r -a cert_array <<< "${CERT_DOMAINS}"
        for cert_domain in "${cert_array[@]}"; do
          slug="${cert_domain//\*/_wildcard}"
          rm -rf ~/certs/${slug}
        done
